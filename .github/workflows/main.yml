

name: Salesforce LWC & Apex Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check Apex and LWC files
      run: |
        echo "Checking Salesforce project structure..."
        find . -type f -name "*.cls" -o -name "*.trigger" -o -name "*.html" -o -name "*.js" -o -name "*.xml"
        echo "✅ Salesforce Apex and LWC code validation complete."
